<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星幕 · 媒体库</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .scroll{flex:1;padding:0 28px;overflow:hidden}
  .sechead{display:flex;align-items:baseline;gap:10px;padding:10px 2px 12px}
  .sechead h2{font-size:15.5px;font-weight:650;letter-spacing:-.01em}
  .sechead .more{margin-left:auto;font-size:12px;color:var(--sub)}
  .sechead .cnt{font-size:11.5px;color:var(--ter)}
  .ccrow{display:flex;gap:16px}
  .ccard{position:relative;width:258px;height:146px}
  .ccard .art{position:absolute;inset:0}
  .cinfo{position:absolute;left:12px;right:12px;bottom:10px}
  .cinfo .t{font-size:12.5px;font-weight:650;text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .cinfo .t span{font-weight:500;color:rgba(235,235,245,.72);font-size:11.5px}
  .cinfo .bar{margin-top:7px;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden}
  .cinfo .bar i{display:block;height:100%;background:#fff;border-radius:2px}
  .grid{display:flex;gap:16px}
  .poster{width:204px}
  .poster .art{width:204px;height:306px}
  .poster figcaption{padding-top:9px;line-height:1.25}
  .poster b{font-size:12.5px;font-weight:650;display:block}
  .poster span{font-size:11px;color:var(--ter);display:block;margin-top:3px}
  .alltile{width:204px;height:306px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:rgba(255,255,255,.045);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.10);color:var(--sub);font-size:13px;font-weight:600}
  .alltile span{font-size:11px;color:var(--ter);font-weight:500}
  .gridwrap{padding-bottom:80px}
</style>
</head>
<body>
<div class="wall"></div>
<div class="window">
  <aside class="sidebar">
    <div class="top"><div class="lights"><i class="light r"></i><i class="light y"></i><i class="light g"></i></div></div>
    <div class="brand">
      <div class="logo"><svg viewBox="0 0 16 16"><path d="M4.5 2.8v10.4l8.6-5.2-8.6-5.2z"/></svg></div>
      <div class="name">星幕</div><div class="ver">v0.1</div>
    </div>
    <nav class="nav">
      <div class="label">媒体库</div>
      <div class="item active"><svg viewBox="0 0 16 16"><path d="M2.5 6.8 8 2.6l5.5 4.2v6.2h-11z"/><path d="M6.6 13v-3.4h2.8V13"/></svg>首页</div>
      <div class="item"><svg viewBox="0 0 16 16"><rect x="2.5" y="3.8" width="11" height="8.4" rx="2"/><path d="M5.6 3.8v8.4M10.4 3.8v8.4"/></svg>电影<span class="count">86</span></div>
      <div class="item"><svg viewBox="0 0 16 16"><rect x="2.5" y="3.4" width="11" height="7.6" rx="2"/><path d="M6.2 13.6h3.6"/></svg>剧集<span class="count">42</span></div>
      <div class="item"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 5.1V8l2.1 1.5"/></svg>最近播放</div>
      <div class="label">来源</div>
      <div class="item"><svg viewBox="0 0 16 16"><path d="M2.6 5.6c0-1 .8-1.8 1.8-1.8h2.3l1.5 1.6h5.4c1 0 1.8.8 1.8 1.8v4.3c0 1-.8 1.8-1.8 1.8H4.4c-1 0-1.8-.8-1.8-1.8z"/></svg>本地文件</div>
      <div class="item"><svg viewBox="0 0 16 16"><path d="M5 11.6h6.3a2.35 2.35 0 0 0 .3-4.7 3.5 3.5 0 0 0-6.7-.9A2.65 2.65 0 0 0 5 11.6z"/></svg>百度网盘<i class="dotg"></i></div>
      <div class="item"><svg viewBox="0 0 16 16"><path d="M6.6 9.4 4.2 11.8a2.2 2.2 0 0 1-3.1-3.1l2.4-2.4"/><path d="M9.4 6.6l2.4-2.4a2.2 2.2 0 0 1 3.1 3.1l-2.4 2.4"/><path d="M6.2 9.8l3.6-3.6"/></svg>WebDAV</div>
      <div class="item"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 5.4v5.2M5.4 8h5.2"/></svg>添加来源</div>
    </nav>
    <div class="grow"></div>
    <nav class="nav">
      <div class="item"><svg viewBox="0 0 16 16"><path d="M2.8 5h10.4M2.8 11h10.4"/><circle cx="6" cy="5" r="1.6"/><circle cx="10.2" cy="11" r="1.6"/></svg>设置</div>
    </nav>
  </aside>
  <main class="main">
    <header class="toolbar">
      <h1>媒体库</h1><span class="meta">128 部影片 · 3 个来源</span>
      <div class="spacer"></div>
      <div class="search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 13.6 13.6"/></svg>搜索影片、剧集或文件</div>
      <div class="iconbtn"><svg viewBox="0 0 16 16"><rect x="2.6" y="2.6" width="4.6" height="4.6" rx="1.2"/><rect x="8.8" y="2.6" width="4.6" height="4.6" rx="1.2"/><rect x="2.6" y="8.8" width="4.6" height="4.6" rx="1.2"/><rect x="8.8" y="8.8" width="4.6" height="4.6" rx="1.2"/></svg></div>
      <div class="iconbtn" style="background:transparent;box-shadow:none"><svg viewBox="0 0 16 16" style="opacity:.5"><path d="M2.6 4h10.8M2.6 8h10.8M2.6 12h10.8"/></svg></div>
    </header>
    <div class="scroll">
      <div class="sechead"><h2>继续观看</h2><span class="cnt">2 个来源</span><span class="more">全部 ›</span></div>
      <div class="ccrow">
        <div class="ccard"><div class="art g5"></div><div class="cinfo"><div class="t">星际穿越 <span>· 剩 1:12:34</span></div><div class="bar"><i style="width:36%"></i></div></div></div>
        <div class="ccard"><div class="art g7"></div><div class="cinfo"><div class="t">三体 · S01E08 <span>· 剩 12 分钟</span></div><div class="bar"><i style="width:78%"></i></div></div></div>
        <div class="ccard"><div class="art g8"></div><div class="cinfo"><div class="t">灌篮高手 <span>· 剩 1:43:02</span></div><div class="bar"><i style="width:12%"></i></div></div></div>
        <div class="ccard"><div class="art g3"></div><div class="cinfo"><div class="t">花样年华 <span>· 剩 28 分钟</span></div><div class="bar"><i style="width:64%"></i></div></div></div>
      </div>
      <div class="sechead" style="padding-top:22px"><h2>最近添加</h2><span class="cnt">24 部</span><span class="more">按添加时间 ›</span></div>
      <div class="grid gridwrap">
        <figure class="poster"><div class="art g1"></div><figcaption><b>沙丘 2</b><span>2024 · 4K HDR</span></figcaption></figure>
        <figure class="poster"><div class="art g2"></div><figcaption><b>奥本海默</b><span>2023 · 1080P</span></figcaption></figure>
        <figure class="poster"><div class="art g3"></div><figcaption><b>花样年华</b><span>2000 · 修复版</span></figcaption></figure>
        <figure class="poster"><div class="art g4"></div><figcaption><b>银翼杀手 2049</b><span>2017 · 1080P</span></figcaption></figure>
        <div class="alltile">查看全部<span>128 部影片 ›</span></div>
      </div>
    </div>
    <div class="mini">
      <div class="mt art g5"></div>
      <div class="mi"><div class="mtitle">星际穿越</div><div class="msub">1:12:33 / 2:49:07 · 百度网盘</div></div>
      <button class="pp-white"><svg viewBox="0 0 16 16"><path d="M5 2.8v10.4L13 8 5 2.8z"/></svg></button>
      <div class="iconbtn"><svg viewBox="0 0 16 16"><path d="M6 2.8h-3v3M10 2.8h3v3M6 13.2h-3v-3M10 13.2h3v-3"/></svg></div>
      <div class="iconbtn"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></div>
      <div class="prog"><i></i></div>
    </div>
  </main>
</div>
</body>
</html>
