<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星幕 · 播放器</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .pwin{background:#04050a;position:relative}
  .scene{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 18%,#0b1322 0%,#05070d 58%,#020308 100%);overflow:hidden}
  .stars{position:absolute;inset:0;width:100%;height:100%}
  .planet{position:absolute;left:-520px;bottom:-1050px;width:1300px;height:1300px;border-radius:50%;
    background:radial-gradient(circle at 50% 7.5%,#f3d3a2 0%,#e0a05c 5%,#96522a 17%,#332015 38%,#0a0a10 56%,#05070c 68%);
    box-shadow:0 0 150px 26px rgba(255,168,88,.20)}
  .glowline{position:absolute;left:-160px;right:-160px;bottom:126px;height:2px;
    background:linear-gradient(90deg,transparent,rgba(255,196,128,.85),transparent);filter:blur(2px);opacity:.5}
  .vig{position:absolute;inset:0;box-shadow:inset 0 0 260px rgba(0,0,0,.78),inset 0 -180px 260px rgba(0,0,0,.5)}
  .lights{position:absolute;left:18px;top:19px;z-index:5}
  .glass{background:rgba(28,28,33,.55);backdrop-filter:blur(30px) saturate(170%);
    box-shadow:0 14px 40px rgba(0,0,0,.45),0 0 0 .5px rgba(255,255,255,.14),0 1px 0 rgba(255,255,255,.07) inset}
  .topbar{position:absolute;left:96px;right:18px;top:16px;height:52px;border-radius:14px;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:4}
  .ptitle{font-size:13.5px;font-weight:650;white-space:nowrap}
  .ptitle span{color:var(--sub);font-weight:500;margin-left:7px;font-size:12px}
  .dotg2{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px rgba(48,209,88,.9)}
  .subtitle{position:absolute;left:0;right:0;bottom:205px;text-align:center;font-size:21px;font-weight:500;letter-spacing:.3px;
    text-shadow:0 2px 12px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9);z-index:3}
  .controls{position:absolute;left:18px;right:18px;bottom:16px;border-radius:18px;padding:10px 18px 12px;z-index:4}
  .scrubwrap{position:relative;padding:12px 0 12px}
  .track{position:relative;height:4px;border-radius:2px;background:rgba(255,255,255,.20)}
  .track .buf{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:rgba(255,255,255,.36)}
  .track .pl{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
  .track .knob{position:absolute;top:50%;width:13px;height:13px;margin-left:-6.5px;transform:translateY(-50%);border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.55)}
  .tip{position:absolute;left:42%;bottom:30px;transform:translateX(-50%);border-radius:10px;overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.55),0 0 0 .5px rgba(255,255,255,.16)}
  .tip .tart{width:152px;height:86px;border-radius:0;box-shadow:none}
  .tip .tt{position:absolute;left:8px;bottom:6px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;text-shadow:0 1px 5px rgba(0,0,0,.9)}
  .crow{display:flex;align-items:center;gap:10px}
  .pp{width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.45);flex:0 0 auto}
  .pp svg{width:15px;height:15px;fill:#000;margin-left:1.5px}
  .time{font-size:12.5px;font-variant-numeric:tabular-nums;margin-left:6px}
  .time span{color:var(--sub)}
</style>
</head>
<body>
<div class="wall"></div>
<div class="window pwin">
  <div class="scene">
    <svg class="stars" viewBox="0 0 1376 836" preserveAspectRatio="none">
      <g fill="#ffffff">
        <circle cx="150" cy="80" r="1.4" opacity=".85"/><circle cx="300" cy="40" r="1" opacity=".6"/>
        <circle cx="470" cy="110" r="1.2" opacity=".7"/><circle cx="640" cy="60" r="1.6" opacity=".9"/>
        <circle cx="820" cy="120" r="1" opacity=".55"/><circle cx="980" cy="52" r="1.3" opacity=".8"/>
        <circle cx="1130" cy="96" r="1" opacity=".6"/><circle cx="1280" cy="60" r="1.5" opacity=".85"/>
        <circle cx="220" cy="210" r="1" opacity=".5"/><circle cx="420" cy="260" r="1.2" opacity=".65"/>
        <circle cx="610" cy="196" r="1" opacity=".5"/><circle cx="760" cy="240" r="1.3" opacity=".7"/>
        <circle cx="930" cy="200" r="1" opacity=".5"/><circle cx="1090" cy="250" r="1.2" opacity=".65"/>
        <circle cx="1240" cy="190" r="1" opacity=".55"/><circle cx="1320" cy="300" r="1.3" opacity=".7"/>
        <circle cx="900" cy="330" r="1" opacity=".45"/><circle cx="1010" cy="400" r="1.2" opacity=".55"/>
        <circle cx="1180" cy="430" r="1" opacity=".5"/><circle cx="700" cy="360" r="1" opacity=".4"/>
      </g>
    </svg>
    <div class="glowline"></div>
    <div class="planet"></div>
    <div class="vig"></div>
  </div>
  <div class="lights"><i class="light r"></i><i class="light y"></i><i class="light g"></i></div>
  <div class="glass topbar">
    <div class="iconbtn"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></div>
    <div class="ptitle">星际穿越<span>Interstellar (2014)</span></div>
    <span class="chip"><i class="dotg2"></i>4K · HDR · 百度网盘</span>
    <div class="spacer"></div>
    <div class="iconbtn"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6"/><path d="M8 7.4v3.4M8 5.2v.2"/></svg></div>
    <div class="iconbtn"><svg viewBox="0 0 16 16"><path d="M8 10.6V3.2M5.4 5.8 8 3.2l2.6 2.6"/><path d="M3.4 10.4v1.8c0 .7.6 1.3 1.3 1.3h6.6c.7 0 1.3-.6 1.3-1.3v-1.8"/></svg></div>
    <div class="iconbtn"><svg viewBox="0 0 16 16"><circle cx="3.4" cy="8" r="1"/><circle cx="8" cy="8" r="1"/><circle cx="12.6" cy="8" r="1"/></svg></div>
  </div>
  <div class="subtitle">不要温和地走进那个良夜。</div>
  <div class="glass controls">
    <div class="scrubwrap">
      <div class="track">
        <i class="buf" style="width:76%"></i><i class="pl" style="width:42%"></i><b class="knob" style="left:42%"></b>
      </div>
      <div class="tip"><div class="art g4 tart"></div><div class="tt">1:12:33</div></div>
    </div>
    <div class="crow">
      <div class="iconbtn"><svg viewBox="0 0 16 16"><path d="M7.4 5.4 5 7.8l2.4 2.4"/><path d="M5 7.8h5.4a3 3 0 1 1-3 3"/></svg></div>
      <button class="pp"><svg viewBox="0 0 16 16"><path d="M5 2.8v10.4L13 8 5 2.8z"/></svg></button>
      <div class="iconbtn"><svg viewBox="0 0 16 16"><path d="M8.6 5.4 11 7.8l-2.4 2.4"/><path d="M11 7.8H5.6a3 3 0 1 0 3 3"/></svg></div>
      <div class="time">1:12:33 <span>/ 2:49:07</span></div>
      <div class="spacer"></div>
      <div class="chip"><b>剧集</b> · 12</div>
      <div class="chip"><b>1.0×</b></div>
      <div class="chip"><b>字幕</b> · 简中</div>
      <div class="chip"><b>音轨</b> · 国语 5.1</div>
      <div class="iconbtn"><svg viewBox="0 0 16 16"><rect x="2.4" y="3.6" width="11.2" height="8.8" rx="1.8"/><rect x="8.6" y="7.6" width="4" height="3.6" rx="1" fill="currentColor" stroke="none"/></svg></div>
      <div class="iconbtn"><svg viewBox="0 0 16 16"><path d="M6 2.8H3.2v2.8M10 2.8h2.8v2.8M6 13.2H3.2v-2.8M10 13.2h2.8v-2.8"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
